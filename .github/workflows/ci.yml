name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Build, Test, Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (biome)
        run: bun run lint
      - name: Build plugins (for executor dist)
        # Inferred targets invoke executors from packages/*/dist, so every
        # plugin that contributes an executor must be built before run-many.
        run: |
          cd packages/typescript-preset && bun run build
          cd ../skill && bun run build
          cd ../skillspector && bun run build
          cd ../diagrams && bun run build
          cd ../sverka && bun run build
      - name: Lint, Build, Test, Typecheck (Nx inferred targets)
        # packages/* only — skills-* build must not run concurrently with a
        # packages/skill rebuild: the executor is loaded from packages/skill/dist
        # and tsdown rewrites it mid-build.
        run: bun --bun node_modules/.bin/nx run-many -t lint,build,test,typecheck --exclude 'skills-*' --verbose
      - name: Skill lint + build (Nx inferred targets)
        # Runs after all plugin dists are stable; covers skills lint via
        # markdownlint and skills build via skills-compiler.
        run: bun --bun node_modules/.bin/nx run-many -t lint,build --projects 'skills-*' --verbose
      - name: Render diagrams
        # docs/diagrams/*.mmd → SVG via @nx-devkit/diagrams (Kroki backend).
        # Kroki is an external service — retry transient timeouts.
        run: |
          for i in 1 2 3; do
            bun --bun node_modules/.bin/nx run-many -t diagrams --verbose && exit 0
            [ "$i" -eq 3 ] && exit 1
            echo "diagrams render attempt $i failed — retrying"
            sleep 5
          done
      - name: Skill validation targets
        run: bun --bun node_modules/.bin/nx run-many -t validate,os-check,size-check --projects 'skills-*' --verbose
      - name: Install SkillSpector
        # Not published to PyPI — install the pinned tag into the venv path
        # referenced by nx.json (skillspectorBin).
        run: |
          python3 -m venv .tools/skillspector-venv
          .tools/skillspector-venv/bin/pip install \
            "git+https://github.com/NVIDIA/skillspector.git@v2.11.2"
      - name: SkillSpector scans
        run: bun --bun node_modules/.bin/nx run-many -t scan --projects 'skills-*' --verbose
      - name: Emit scan annotations
        # The scan executor writes annotations-<project>.txt files with GitHub
        # workflow commands; printing them surfaces findings as PR annotations.
        if: always()
        run: cat annotations-*.txt 2>/dev/null || true

  e2e-packed:
    name: Packed-tarball e2e (nx${{ matrix.nx }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nx: ["24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Packed-tarball e2e
        run: bash scripts/e2e-packed.sh
        env:
          E2E_NX_RANGE: ^${{ matrix.nx }}

      - run: bunx nx fix-ci
        if: always()
