name: release-preview

# Maintains a single draft GitHub release ("next") whose body is the exact
# changelog `nx release` will publish for the commits on main — the pending
# release made visible. Runs the same version+changelog pipeline as
# release.yml but never pushes, publishes, or creates real releases:
# `nx release version --git-push=false` leaves a local commit that dies
# with the runner, and nx.json's createRelease is patched to false so the
# changelog step cannot open GitHub releases for unpublished versions.

on:
  push:
    branches: [main]
  # Re-run after a release ships so the draft reflects the NEXT pending
  # batch (usually "nothing pending" → draft deleted).
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      specifier:
        description: >-
          Force a version specifier for all release projects, bypassing
          conventional-commit derivation — previews a release that pending
          commits would not produce (demo/forced-release preview).
          Leave at "none" for the usual pending-release preview.
        required: false
        type: choice
        default: none
        options: [none, patch, minor, major]
  # Reusable entrypoint: other repositories call this workflow via
  # `uses: nx-devkit/nx.ts/.github/workflows/release-preview.yml@<ref>`.
  # github.event_name inside the callee is the CALLER's event, so push /
  # release / dispatch guards below keep working unchanged.
  workflow_call:
    inputs:
      specifier:
        description: >-
          Force a version specifier for all release projects, bypassing
          conventional-commit derivation. One of none|patch|minor|major —
          anything else behaves as "none".
        required: false
        # workflow_call supports only boolean|number|string — `choice` is
        # workflow_dispatch-only and would make GitHub reject this file.
        type: string
        default: none
      branch:
        description: >-
          Default branch that receives release commits — the draft "next"
          is only maintained while the caller's ref matches it.
        required: false
        type: string
        default: main
      tag-prefix:
        description: >-
          Release-tag prefix identifying this repo's packages — nx release
          tags look like `<prefix><project>@<version>` (e.g. `@myorg/`).
        required: false
        type: string
        default: '@nx-devkit/'
      source-ref:
        description: >-
          Ref of nx-devkit/nx.ts the helper scripts are loaded from — pin
          the same ref as the `uses:` call (tag, branch, or SHA).
        required: true
        type: string
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        required: false

# Same Nx Cloud token wiring as release.yml — the preview's nx invocations
# hit the same 401s without it.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  preview:
    # Same loop guard as release.yml: bot release commits ("chore(release)")
    # must not retrigger. push events only — workflow_run/dispatch always run.
    # Every event must target the release branch: a workflow_dispatch from a
    # feature ref would otherwise replace the shared "next" draft with that
    # branch's preview. push events are already branch-only via branches:
    # [main]; workflow_run inherits the default-branch ref; workflow_call
    # callers pass their branch through inputs.branch.
    if: >-
      github.ref == format('refs/heads/{0}', inputs.branch || 'main') &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)'))
    runs-on: ubuntu-latest
    env:
      # `||` would collapse an explicit empty prefix (unscoped `pkg@1.2.3`
      # tags are valid); on workflow_call the input default already applies,
      # so only non-call events take the repository fallback.
      TAG_PREFIX: ${{ github.event_name != 'workflow_call' && '@nx-devkit/' || inputs.tag-prefix }}
    concurrency:
      group: release-preview
      cancel-in-progress: true
    permissions:
      contents: write # draft release create/edit/delete via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure git identity for the local version commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Version packages locally (conventional commits, no push)
        # Identical derivation to release.yml — the local chore(release)
        # commit and its tags never leave the runner.
        # Membership test instead of an event_name gate: inputs.specifier is
        # populated for BOTH workflow_dispatch and workflow_call, and is empty
        # for push/workflow_run — so 'none'/unset never produces a flag.
        run: npx nx release version --git-push=false ${{ contains(fromJSON('["patch","minor","major"]'), inputs.specifier) && format('--specifier={0}', inputs.specifier) || '' }}
      - name: Disable GitHub release creation for the preview
        # nx.json sets changelog.projectChangelogs.createRelease: "github";
        # without this patch the changelog step would create REAL GitHub
        # releases for versions that were never published. The flag is not
        # exposed on the CLI, so patch the config in this ephemeral tree.
        run: |
          sed -i 's/"createRelease": "github"/"createRelease": false/' nx.json
          grep -q '"createRelease": false' nx.json || {
            echo "createRelease patch did not apply — refusing to continue" >&2
            exit 1
          }
      - name: Generate changelog entries locally
        # Same loop as release.yml, minus git push and GitHub releases.
        run: |
          # awk index() = literal prefix match (grep would treat the
          # prefix as a regex — a '.' in a scope would over-match).
          for tag in $(git tag --points-at HEAD | awk -v p="$TAG_PREFIX" 'index($0, p) == 1'); do
            project="${tag%@*}"
            version="${tag##*@}"
            prev=$(git tag --list "${project}@*" --sort=-version:refname | sed -n '2p')
            if [ -n "$prev" ]; then
              npx nx release changelog "$version" -p "$project" --from "$prev" \
                --git-commit=false --git-tag=false --git-push=false
            else
              npx nx release changelog "$version" -p "$project" --first-release \
                --git-commit=false --git-tag=false --git-push=false
            fi
          done
      - name: Assemble preview markdown
        id: preview
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        # Native runs have scripts/release-preview.ts in the checkout.
        # Reusable callers check out THEIR repo — the helper is fetched
        # from nx-devkit/nx.ts at the same ref the caller pinned in uses:.
        # It lands in tmp/ (gitignored, one level deep) because the script
        # resolves the workspace root as join(import.meta.dir,'..') —
        # /tmp would resolve root to '/' and find no packages/.
        run: |
          script=scripts/release-preview.ts
          if [ ! -f "$script" ]; then
            [ -n "$SOURCE_REF" ] || { echo "scripts/release-preview.ts missing and source-ref input is empty" >&2; exit 1; }
            mkdir -p tmp
            curl -fsSL "https://raw.githubusercontent.com/nx-devkit/nx.ts/${SOURCE_REF}/scripts/release-preview.ts" -o tmp/release-preview.ts
            script=tmp/release-preview.ts
          fi
          bun "$script"
      - name: Ensure preview body file exists
        # The artifact is uploaded unconditionally: an empty body marks
        # "nothing pending". The ai-notes lookup is artifact-name-keyed
        # (not workflow-name-keyed) so reusable callers work — the newest
        # release-preview-body artifact always reflects the latest preview.
        run: |
          mkdir -p tmp
          [ -f tmp/release-preview.md ] || : > tmp/release-preview.md
      - name: Upload preview body for the AI notes workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preview-body
          path: tmp/release-preview.md
          retention-days: 1
      - name: Upsert the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.preview.outputs.title }}
          HAS_RELEASE: ${{ steps.preview.outputs.has_release }}
          BASE_SHA: ${{ steps.preview.outputs.base }}
        run: |
          tag="next"
          existing=$(gh release view "$tag" --json id --jq .id 2>/dev/null || true)
          if [ "$HAS_RELEASE" != "true" ]; then
            if [ -n "$existing" ]; then
              # Draft releases never create the git ref — --cleanup-tag would
              # 422 deleting refs/tags/next. Only pass it when the ref exists
              # (e.g. someone published the draft).
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                gh release delete "$tag" --yes --cleanup-tag
              else
                gh release delete "$tag" --yes
              fi
            fi
            exit 0
          fi
          if [ -n "$existing" ]; then
            # Pin target to the previewed commit on every refresh — the
            # draft is a snapshot of BASE_SHA, not a moving branch head.
            # --prerelease marks the preview as non-production ready, but
            # only on drafts — never downgrade an already-published release.
            is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            prerelease_flag=()
            [ "$is_draft" = "true" ] && prerelease_flag=(--prerelease)
            gh release edit "$tag" --target "$BASE_SHA" "${prerelease_flag[@]}" \
              --title "$TITLE" --notes-file tmp/release-preview.md
          else
            gh release create "$tag" --draft --prerelease --target "$BASE_SHA" \
              --title "$TITLE" --notes-file tmp/release-preview.md
          fi
