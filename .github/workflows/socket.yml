name: Socket Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  socket:
    name: Socket supply-chain scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - name: Check for Socket API key
        id: key
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SOCKET_SECURITY_API_KEY not set — skipping Socket scan. Add the repo secret to enable it."
          fi
      - name: Install Socket CLI
        if: steps.key.outputs.present == 'true'
        run: npm install -g socket@1.2.1
      - name: Socket scan
        if: steps.key.outputs.present == 'true'
        # `socket ci` = `socket scan create --report`; uses the API token's
        # default org and exits non-zero when alerts violate org policy.
        run: socket ci
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
