name: Socket Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  socket:
    name: Socket supply-chain scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Check for Socket API key
        id: key
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SOCKET_SECURITY_API_KEY not set — skipping Socket scan. Add the repo secret to enable it."
          fi
      - name: Install Socket CLI
        if: steps.key.outputs.present == 'true'
        run: npm install -g socket
      - name: Socket scan
        if: steps.key.outputs.present == 'true'
        # `socket ci` = `socket scan create --report`; uses the API token's
        # default org and exits non-zero when alerts violate org policy.
        run: socket ci
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
